<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块 | Tetris Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>俄罗斯方块 | Tetris</h1>
            <div class="score-container">
                <div class="score">分数 | Score: <span id="score">0</span></div>
                <div class="level">等级 | Level: <span id="level">1</span></div>
            </div>
        </div>
        <div class="game-area">
            <canvas id="tetris" width="300" height="600"></canvas>
            <div class="game-info">
                <div class="next-piece">
                    <h3>下一个方块 | Next</h3>
                    <canvas id="nextPiece" width="100" height="100"></canvas>
                </div>
                <div class="controls">
                    <h3>操作说明 | Controls</h3>
                    <p>← 左移 | Move Left</p>
                    <p>→ 右移 | Move Right</p>
                    <p>↓ 加速下落 | Speed Up</p>
                    <p>↑ 旋转 | Rotate</p>
                    <p>空格 暂停 | Space to Pause</p>
                    <p>D 双方块模式 | Dual Block Mode</p>
                </div>
                <div class="history-section">
                    <h3>历史记录 | History</h3>
                    <div id="historyList" class="history-list">
                        <!-- History records will be displayed here -->
                    </div>
                </div>
                <div class="mode-toggle">
                    <label class="mode-label">双方块模式 | Dual Block Mode</label>
                    <button id="dualModeButton" class="mode-button">关闭 | Off</button>
                </div>
            </div>
        </div>
        <div class="button-group">
            <button id="startButton" class="game-button start-button">开始游戏 | Start Game</button>
            <button id="pauseButton" class="game-button pause-button">暂停 | Pause</button>
            <button id="exitButton" class="game-button exit-button">退出 | Exit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
